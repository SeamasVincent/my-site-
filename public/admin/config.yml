backend:
  name: github
  repo: SeamasVincent/my-site-
  branch: main
  base_url: https://seamas.sokeafrica.com
  auth_endpoint: api/decap/auth
  use_graphql: true
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
locale: en
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'
collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: content/insights
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{type}} · {{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase letters and numbers separated by single hyphens.'], hint: 'Keep published slugs stable. Use a unique slug; append -2 for a duplicate. When changing a slug, add the old value to Previous slugs.' }
      - { label: Visibility, name: status, widget: select, options: [published, draft], default: published }
      - { label: Previous slugs (for redirects), name: previousSlugs, widget: list, required: false }
      - { label: Content type, name: type, widget: select, options: [article, video, podcast] }
      - { label: Summary, name: summary, widget: text }
      - { label: Thumbnail, name: image, widget: image, required: false }
      - { label: Image description, name: imageAlt, widget: string, required: false }
      - { label: Thumbnail focal X (0–100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
      - { label: Thumbnail focal Y (0–100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
      - { label: Published date, name: publishedAt, widget: datetime, time_format: false, required: false }
      - { label: Episode article / Article body, name: body, widget: markdown, required: false }
      - label: Playback links (Video and Podcast)
        name: playbackLinks
        widget: list
        required: false
        summary: '{{fields.format}} on {{fields.platform}}'
        hint: 'Add links in playback order. All valid links appear on the card. Podcasts can mix Watch and Listen. Articles ignore these links.'
        fields:
          - { label: Platform name, name: platform, widget: string }
          - { label: HTTPS URL, name: url, widget: string, pattern: ['^https://[^/\s]+.*$', 'Enter an HTTPS URL.'] }
          - { label: Format, name: format, widget: select, options: [Watch, Listen] }
      - { label: Legacy playback URL (fallback), name: platformUrl, widget: string, required: false, hint: Used only when Playback links has no valid links. }
      - { label: Platform name, name: platformName, widget: string, required: false }
      - { label: Additional information, name: notes, widget: text, required: false }
      - label: Related links
        name: relatedLinks
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL (HTTPS), name: url, widget: string }
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    delete: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{title}} ? {{publication.status}}'
    preview_path: work/{{slug}}
    sortable_fields:
      - title
      - publication.order
      - publication.status
    view_filters:
      - label: Published
        field: publication.status
        pattern: published
      - label: Drafts
        field: publication.status
        pattern: draft
      - label: Archived
        field: publication.status
        pattern: archived
      - label: Hidden
        field: publication.status
        pattern: hidden
      - label: Featured
        field: publication.featured
        pattern: true
    fields:
      - name: title
        label: Project title
        widget: string
      - name: slug
        label: Public URL slug
        widget: string
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Use lowercase letters and numbers separated by hyphens.
        hint: >-
          Must be unique, including draft and archived projects. Previous saved slugs are retained automatically.
          Duplicating a project requires a new slug and cleared previous slugs / saved slug.
      - name: previousSlugs
        label: Previous slugs (redirects)
        widget: list
        required: false
      - name: savedSlug
        label: Redirect tracking slug
        widget: string
        hint: Managed automatically on save. Clear this and Previous slugs when duplicating a project.
        required: false
      - name: basics
        label: Project basics
        widget: object
        fields:
          - name: organisation
            label: Organisation
            widget: string
            required: false
          - name: description
            label: Short description
            widget: text
            required: false
          - name: role
            label: My role
            widget: string
            required: false
          - name: categories
            label: Categories
            widget: list
            required: false
            min: 1
          - name: year
            label: Year
            widget: string
            required: false
          - name: startDate
            label: Engagement start
            widget: datetime
            required: false
            time_format: false
          - name: endDate
            label: Engagement end
            widget: datetime
            required: false
            time_format: false
          - name: location
            label: Location
            widget: string
            required: false
      - name: visuals
        label: Visuals
        widget: object
        fields:
          - name: cover
            label: Cover image
            widget: image
            required: false
          - name: coverAlt
            label: Cover alternative text
            widget: string
            required: false
          - name: gallery
            label: Gallery
            widget: list
            required: false
            fields:
              - name: image
                label: Image
                widget: image
              - name: alt
                label: Alternative text
                widget: string
              - name: caption
                label: Caption
                widget: string
                required: false
      - name: story
        label: Case study
        widget: object
        fields:
          - name: overview
            label: Overview
            widget: markdown
            required: false
          - name: challenge
            label: Challenge
            widget: markdown
            required: false
          - name: contribution
            label: My contribution
            widget: markdown
            required: false
            hint: Describe your personal responsibilities and decisions. Credit collaborators separately.
          - name: approach
            label: Approach and execution
            widget: markdown
            required: false
          - name: results
            label: Results
            widget: markdown
            required: false
            hint: Identify team outcomes and explain your contribution without claiming sole credit.
          - name: lessons
            label: Lessons
            widget: markdown
            required: false
      - name: metrics
        label: Metrics
        widget: list
        required: false
        fields:
          - name: value
            label: Value
            widget: string
          - name: label
            label: Metric
            widget: string
          - name: context
            label: Context and attribution
            widget: text
            hint: Include timeframe, source, baseline and whether this was a team outcome.
      - name: testimonial
        label: Testimonial
        widget: object
        fields:
          - name: quote
            label: Quote
            widget: text
            required: false
          - name: name
            label: Name
            widget: string
            required: false
          - name: attribution
            label: Role / organisation
            widget: string
            required: false
        required: false
      - name: externalLinks
        label: External links
        widget: list
        required: false
        fields:
          - name: label
            label: Label
            widget: string
          - name: url
            label: HTTPS URL
            widget: string
            pattern:
              - ^https://[^/\s]+.*$
              - Enter an HTTPS URL.
      - name: publication
        label: Publication settings
        widget: object
        fields:
          - name: status
            label: Visibility
            widget: select
            options:
              - draft
              - published
              - hidden
              - archived
            default: draft
            hint: >-
              Only published projects appear publicly. Set published before the final editorial Publish action; hidden and
              archived entries return 404.
          - name: featured
            label: Featured
            widget: boolean
            default: false
          - name: order
            label: Manual order
            widget: number
            value_type: int
            default: 100
            min: 0
            hint: Featured work appears first; lower numbers appear first within each group.
      - name: seo
        label: SEO
        widget: object
        fields:
          - name: title
            label: SEO title
            widget: string
            required: false
            hint: Defaults to the project title.
          - name: description
            label: SEO description
            widget: text
            required: false
            hint: Defaults to the short description.
          - name: image
            label: Social image
            widget: image
            required: false
            hint: Defaults to the cover.
        required: false
  - name: resources
    label: Resources
    label_singular: Resource
    folder: content/resources
    create: true
    extension: json
    format: json
    slug: '{{slug}}'
    summary: '{{type}} · {{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Stable slug, name: slug, widget: string }
      - { label: Resource type, name: type, widget: select, options: [Book, Guide, Template, Workbook, Other] }
      - { label: Short description, name: description, widget: text }
      - { label: Resource details, name: details, widget: text, required: false }
      - { label: Publish date, name: publishedAt, widget: datetime, time_format: false, required: false }
      - { label: Picture, name: picture, widget: image, required: false }
      - { label: Picture alternative text, name: pictureAlt, widget: string, required: false }
      - { label: File, name: file, widget: file, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Link label, name: linkLabel, widget: string, required: false }
      - { label: Checkout link, name: checkoutLink, widget: string, required: false }
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site links and photographs
        file: content/site-settings.json
        format: json
        fields:
          - { label: Homepage name, name: heroName, widget: string }
          - { label: Homepage headline, name: heroHeadline, widget: text, hint: Use a line break to separate the two lines. }
          - { label: Homepage role line, name: heroRole, widget: string }
          - { label: Homepage introduction paragraphs, name: heroParagraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Homepage personal introduction heading, name: homeAboutHeading, widget: string }
          - { label: About page opening paragraphs, name: aboutIntroduction, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Speaking page opening paragraphs, name: speakingIntroduction, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Mission page opening paragraphs, name: missionIntroduction, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Books page opening paragraphs, name: booksIntroduction, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Contact page opening paragraphs, name: contactIntroduction, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Workbook Selar URL, name: workbookUrl, widget: string }
          - { label: SỌKẸ Africa website URL, name: sokeUrl, widget: string }
          - { label: Public response expectation, name: responseTimeText, widget: string }
          - label: Social links
            name: socialLinks
            widget: object
            fields:
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: X / Twitter URL, name: x, widget: string, required: false }
              - { label: YouTube URL, name: youtube, widget: string, required: false }
          - label: Additional social links
            name: additionalSocialLinks
            widget: list
            required: false
            fields:
              - { label: Platform name, name: platform, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Hero portrait (supports transparent PNG)
            name: heroPhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0–100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0–100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: Personal introduction photograph
            name: introPhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: SÓKÈ Africa photograph
            name: sokePhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: Speaking photograph
            name: speakingPhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: About portrait
            name: aboutPhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: Creative practice photograph
            name: creativePhoto
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: Workshop thumbnail
            name: teachingThumbnail
            widget: object
            fields:
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: About hero photo
            name: aboutHeroPhoto
            widget: object
            fields: &photo_fields
              - { label: Image, name: image, widget: image, required: false }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50 }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50 }
          - label: Speaking hero photo
            name: speakingHeroPhoto
            widget: object
            fields: *photo_fields
          - label: Insights hero photo
            name: insightsHeroPhoto
            widget: object
            fields: *photo_fields
          - label: Books hero photo
            name: booksHeroPhoto
            widget: object
            fields: *photo_fields
          - label: Contact hero photo
            name: contactHeroPhoto
            widget: object
            fields: *photo_fields
          - label: Mission hero photo
            name: missionHeroPhoto
            widget: object
            fields: *photo_fields
          - label: Mission photos after impact figures
            name: missionImpactPhotos
            widget: list
            required: false
            fields: &gallery_fields
              - { label: Image, name: image, widget: image }
              - { label: Alternative text, name: alt, widget: string, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
              - { label: Crop focal point X (0-100), name: focalX, widget: number, min: 0, max: 100, default: 50, required: false }
              - { label: Crop focal point Y (0-100), name: focalY, widget: number, min: 0, max: 100, default: 50, required: false }
          - label: Mission photos after How I contribute
            name: missionContributionPhotos
            widget: list
            required: false
            fields: *gallery_fields
          - label: About story gallery
            name: aboutPhotoGallery
            widget: list
            required: false
            fields: *gallery_fields
          - label: Speaking workshop photos
            name: speakingWorkshopPhotos
            widget: list
            required: false
            fields: *gallery_fields
          - label: Speaking event gallery
            name: speakingEventPhotos
            widget: list
            required: false
            fields: *gallery_fields
          - label: The work kept evolving photo
            name: evolvingPhoto
            widget: object
            required: false
            fields: *photo_fields
          - label: What building has taught me photo
            name: buildingPhoto
            widget: object
            required: false
            fields: *photo_fields
          - label: What I believe photo
            name: beliefsPhoto
            widget: object
            required: false
            fields: *photo_fields
          - label: Building and teaching photo
            name: teachingPhoto
            widget: object
            required: false
            fields: *photo_fields
  - name: experience
    label: Speaking experience
    files:
      - name: engagements
        label: Confirmed speaking and teaching experience
        file: content/speaking-experience.json
        format: json
        fields:
          - label: Engagements (keep roles and dates accurate)
            name: items
            widget: list
            fields:
              - { label: Stable ID (do not change), name: id, widget: string }
              - { label: Event or programme title, name: title, widget: string }
              - { label: Exact contribution / role, name: role, widget: text }
              - { label: Category, name: type, widget: string }
              - { label: Year (optional), name: date, widget: string, required: false }
              - { label: Engagement photo, name: photo, widget: image, required: false }
              - { label: Photo alt text, name: photoAlt, widget: string, required: false }
              - { label: Photo focal point X (0-100), name: focalX, widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
              - { label: Photo focal point Y (0-100), name: focalY, widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
